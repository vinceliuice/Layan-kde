[General]
# --- Hintergrund ------------------------------------------------------------
# Pfad relativ zum Theme-Ordner (oder absolut). Leer = nur Hintergrundfarbe.
background=background.jpg
fallbackColor=#25252d
# Weichzeichnen (0.0 - 1.0) und Abdunkeln (0.0 - 1.0)
blur=0
dim=0

# --- Farben -----------------------------------------------------------------
accentColor=#5657f5
accentTextColor=#ffffff
textColor=#ffffff
errorColor=#ff7b7b
panelColor=#2b2b36
panelTextColor=#ffffff

# --- Schrift ----------------------------------------------------------------
# Leer = Systemschrift. fontSize in pt (Basis für alle Beschriftungen).
fontFamily=
fontSize=10
clockSize=132

# --- Verhalten --------------------------------------------------------------
showClock=true
showDate=true
showHostname=false
virtualKeyboard=true
# false = Anmeldung, Sitzungs-/Layoutwahl und Bildschirmtastatur nur auf dem Primärmonitor
# (nur dort erhält SDDM Tastaturfokus); weitere Monitore zeigen Uhr und Ein-/Aus-Schalter.
loginOnAllScreens=false
# Leer = Locale-Standard, sonst Qt-Format, z. B. HH:mm oder dddd, d. MMMM yyyy
timeFormat=
dateFormat=
